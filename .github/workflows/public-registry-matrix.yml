name: public-registry-matrix

# Post-publication PUBLIC proof for @ecocitizenz/ecz-id-mcp-verifier@0.9.1.
# Read-only. Installs the ALREADY-PUBLISHED package straight from the public npm
# registry and proves it as a real consumer install across Windows/Linux/macOS on
# Node 22.14.0 and Node 24, including the convenience accelerators.
#
# NEVER publishes npm, NEVER changes dist-tags, NEVER creates a tag/Release, NEVER
# publishes to the MCP Registry, NEVER writes the repository. contents: read only.
# It does not change any published package bytes.
#
# RETARGETED 2026-09-23, from 0.8.2 to 0.9.1. This workflow had been silently
# unrunnable since 2026-08-28, when publishing 0.9.0 moved the registry-global
# `next` tag off 0.8.2 — not since 0.9.1. It went unnoticed for 26 days because
# its only automatic trigger was a push to release/npm-0.8.2-registry-edition,
# a branch that has not moved since 2026-07-01. Two structural corrections were
# made with the retarget so it cannot rot the same way again:
#
#   1. ONE PIN PER FACT. The version was previously written in four places
#      (PKG_SPEC, EXPECT_VERSION, and twice inline in the dist-tag script).
#      The inline literals now read EXPECT_VERSION, so a retarget is one edit.
#   2. NO PRE-PUBLICATION TRIGGER. A post-publication proof cannot be driven by
#      a push, because the branch is pushed BEFORE the artifact exists. The dead
#      branch trigger is removed; workflow_dispatch is the honest shape and is
#      how this proof was actually invoked for 0.8.0 and 0.8.1.
#
# `latest` is REPORTED, never asserted. As of 2026-09-23 the registry serves
# latest: 0.9.0 and next: 0.9.1; promoting latest is a Founder action in the
# npmjs.com UI, and no workflow in this repository may change a dist-tag. An
# assertion here would hard-fail this proof over a decision it must not make.

on:
  # Manual only — see RETARGETED note above. Run this AFTER a publish completes.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: public-registry-matrix-${{ github.ref }}
  cancel-in-progress: false

env:
  # The only three values a retarget touches.
  PKG_SPEC: "@ecocitizenz/ecz-id-mcp-verifier@0.9.1"
  EXPECT_VERSION: "0.9.1"
  # Locally packed, CI packed and npm-served tarballs were all this hash.
  CANONICAL_SHA256: "7b124f4190f17833a91c83c63a4661672bd585c968a41e72daf928332a83e929"

jobs:
  fetch-and-verify-public-artifact:
    name: Job 1 — fetch + verify public registry artifact (ubuntu, Node 24)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout harness (no credentials persisted)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prove public dist-tags (EXPECT_VERSION present, next=EXPECT_VERSION)
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const want=process.env.EXPECT_VERSION;
            const https=require("node:https");
            https.get("https://registry.npmjs.org/@ecocitizenz%2fecz-id-mcp-verifier",r=>{let d="";r.on("data",c=>d+=c);r.on("end",()=>{
              const j=JSON.parse(d); const t=j["dist-tags"]||{};
              const fail=m=>{console.error("::error::"+m);process.exit(1);};
              if(!want) fail("EXPECT_VERSION is not set");
              if(!j.versions||!j.versions[want]) fail(want+" not present in registry");
              if(t.next!==want) fail("next != "+want+" (got "+t.next+")");
              console.log("dist-tags OK", JSON.stringify(t));
              if(t.latest!==want) console.log("::notice::latest is "+t.latest+", not "+want+". Reported, not asserted: promoting latest is a Founder action in the npmjs.com UI and no workflow here may change a dist-tag.");
            });}).on("error",e=>{console.error("::error::"+e.message);process.exit(1);});
          '
      - name: Download the exact public tarball via npm pack (registry)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pub
          ( cd _pub && npm pack "$PKG_SPEC" >/dev/null )
          TGZ="$(ls _pub/*.tgz | head -1)"
          SHA="$(node -e "const c=require('node:crypto'),fs=require('node:fs');console.log(c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "$TGZ")"
          echo "public tarball: $TGZ sha256=$SHA"
          if [ "$SHA" != "$CANONICAL_SHA256" ]; then echo "::error::public tarball sha256 $SHA != canonical $CANONICAL_SHA256"; exit 1; fi
          tar -tzf "$TGZ" | sort > _pub/PUBLIC_TARBALL_INVENTORY.txt
          if grep -Eq 'package/(src/|tests/|scripts/|_EVIDENCE/|\.github/)' _pub/PUBLIC_TARBALL_INVENTORY.txt; then echo '::error::forbidden path in public tarball'; exit 1; fi
          echo "$SHA  $(basename "$TGZ")" > _pub/PUBLIC_TARBALL_SHA256.txt
      - name: Upload public artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-registry-artifact-${{ env.EXPECT_VERSION }}
          path: |
            _pub/*.tgz
            _pub/PUBLIC_TARBALL_SHA256.txt
            _pub/PUBLIC_TARBALL_INVENTORY.txt
          if-no-files-found: error
          retention-days: 7

  public-installed-matrix:
    name: Job 2 — public install ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: fetch-and-verify-public-artifact
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.14.0", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout harness only (no credentials persisted)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Prove the public installed package (registry, no source fallback)
        shell: bash
        env:
          ECZ_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          SAFE="$(echo '${{ matrix.os }}-node${{ matrix.node }}' | tr '/.' '--')"
          node scripts/packed-matrix-proof.mjs --spec "$PKG_SPEC" --expect-version "$EXPECT_VERSION" --out "public-matrix-$SAFE.json"
      - name: Upload public matrix cell result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-matrix-result-${{ matrix.os }}-node-${{ matrix.node }}
          path: public-matrix-*.json
          if-no-files-found: warn
          retention-days: 7

  public-provenance:
    name: Job 3 — public provenance (ubuntu, Node 24)
    needs: fetch-and-verify-public-artifact
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install public package and verify provenance/signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _prov && cd _prov
          echo '{"name":"prov","version":"1.0.0","private":true}' > package.json
          npm install "$PKG_SPEC" --no-fund --no-audit
          npm audit signatures | tee ../public-audit-signatures.txt
