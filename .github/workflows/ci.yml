name: CI

# Safe, read-only continuous integration. No publish, no deploy, no repo writes.
#
# Cross-platform release gate: 3 operating systems x 2 Node majors = 6 required
# cells. Before this existed, every gate had only ever been proven on Windows,
# which was the largest evidence gap in the release readiness assessment.
#
# Every cell runs the protocol proofs, not just the unit tests: a stdio server
# is exactly the kind of software that breaks on a different OS (line endings,
# process spawn semantics, stream flushing), so proving it on one platform
# proves very little.
#
# `fail-fast: false` is deliberate — an OS-specific defect must be visible as
# itself, not hidden behind the first cell to go red.

on:
  push:
    branches: [main, "mcp/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Record the exact runtime under test
        shell: bash
        run: |
          echo "os=${{ matrix.os }}  runner=$RUNNER_OS/$RUNNER_ARCH"
          echo "node=$(node --version)  npm=$(npm --version)"

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # --- public-surface and secret hygiene -----------------------------------
      - name: Public-disclosure scan (no internal terms / pricing / P2)
        run: npm run scan:public

      - name: Secret scan
        run: npm run scan:secrets

      - name: Release-state copy gate (latest-first acquisition copy)
        run: npm run check:release-state-copy

      # --- protocol proofs against the BUILT server ----------------------------
      - name: MCP stdio proof (official SDK client)
        run: npm run proof:mcp-stdio

      - name: MCP dual-era wire matrix (2026-07-28 + retained legacy rails)
        run: npm run proof:wire-matrix

      - name: Golden semantic regression
        run: npm run proof:golden

      - name: Privacy / security regression
        run: npm run proof:privacy

      # --- packaging and registry metadata -------------------------------------
      - name: Validate server.json against the live official schema
        run: npm run validate:server-json

      - name: CLI binary entrypoint proof
        run: npm run proof:cli-bin

      - name: Local GitHub Action harness (no network, no repo mutation)
        run: npm run harness:action

      - name: Workflow policy (no repo write, single sanctioned publisher)
        run: npm run check:workflow-policy

      - name: Package allow-list (no source / tests / internal leakage)
        run: npm run check:pack

      - name: Inspect package contents (dry-run, no publish)
        run: npm run pack:inspect

      - name: Cell summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} · Node ${{ matrix.node }} — ${{ job.status }}"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| runner | \`$RUNNER_OS/$RUNNER_ARCH\` |"
            echo "| node | \`$(node --version)\` |"
            echo "| npm | \`$(npm --version)\` |"
            echo "| package version | \`$(node -p "require('./package.json').version")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # A single required check that is green only when EVERY matrix cell is green.
  # Without this, a branch protection rule has to name all six cells by hand and
  # silently stops covering a cell whenever the matrix changes.
  matrix-complete:
    name: cross-platform matrix complete
    runs-on: ubuntu-latest
    needs: verify
    if: always()
    steps:
      - name: Assert every cell passed
        shell: bash
        run: |
          echo "verify result: ${{ needs.verify.result }}"
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "::error::at least one OS/Node cell failed — an OS-specific failure must be fixed, not hidden"
            exit 1
          fi
          echo "All required OS/Node cells passed."
