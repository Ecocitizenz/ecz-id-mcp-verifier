name: "ECZ-ID MCP Verifier"
description: "Local-first, privacy-first ECZ-ID verifier for MCP, agents and APIs. No source upload, telemetry or truth-writing."
author: "EcoCitizenz"

branding:
  icon: "shield"
  color: "green"

inputs:
  target:
    description: "Target to verify (URL, package, repo, or identifier)."
    required: true
  target-type:
    description: "Optional explicit target type hint."
    required: false
    default: ""
  policy:
    description: "Local policy mode: OPEN, PREFER, or REQUIRE."
    required: false
    default: "PREFER"
  operator:
    description: "Operator role: self, third_party, or unknown. Not auto-inferred."
    required: false
    default: "unknown"
  resolver-base:
    description: "Override for the public resolver base URL."
    required: false
    default: "https://resolver.ecocitizenz.org"
  no-network:
    description: "If true, run in fully offline mode."
    required: false
    default: "false"
  offline:
    description: "Alias for no-network. If true, run in fully offline mode."
    required: false
    default: "false"
  json:
    description: "If true, emit JSON output to the log (CLI default)."
    required: false
    default: "true"
  # NO DEFAULT, DELIBERATELY. A declared default is always materialised into
  # INPUT_TIMEOUT-MS by the runner, so the adapter would always pass
  # `--timeout-ms`, and the caller would silently pin the per-attempt timeout
  # back to the value this input declared. That is exactly how the 5 s
  # single-attempt cold-Core failure reached every Action user: measured against
  # a 28.7 s cold start, a pinned 5 s made three attempts fail instead of one.
  # Left unset, the verifier's own bounded-retry defaults apply.
  timeout-ms:
    description: >-
      Per-ATTEMPT timeout for the resolver lookup, in milliseconds. Leave it
      unset unless you have a reason: the default is the verifier's own bounded
      retry, which is sized for a cold Core. Setting it low pins every attempt
      and can report a good record as unavailable.
    required: false

outputs:
  result-state:
    description: "Canonical ResultState produced by the verifier."
  reason-codes:
    description: "Comma-separated canonical ReasonCodes."
  action-envelope-json:
    description: "Local ActionEnvelope JSON describing routing only."
  setup-handoff-json:
    description: "Deterministic Setup Handoff JSON (routing only)."
  mcp-action-envelope-json:
    description: "MCP Action Envelope JSON (route-only posture path). Null for non-MCP targets."
  request-to-resolve-json:
    description: "Request-to-Resolve local guidance packet JSON. signed_request=false; not created server-side."
  primary-action:
    description: "Single deterministic next action verb."
  trustops-action-url:
    description: "Deterministic TrustOps action URL (no secrets, allow-list params)."
  developer-guidance-url:
    description: "Deterministic Developer Gateway guidance URL for this target type."
  passport-opportunity-json:
    description: "Free ECZ-ID Passport opportunity JSON (routing only, never a finding). Null unless the target is an MCP server or agent with no public proof."

runs:
  using: "node24"
  main: "dist/action.js"
